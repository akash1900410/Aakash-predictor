<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akash Predictor</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f3f4f6;
      padding: 20px;
      text-align: center;
    }
    #prediction {
      font-size: 24px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Akash Predictor</h1>
  <p>Next WinGo 30S prediction will appear below:</p>
  <div id="prediction">Loading...</div>

  <script>
    async function fetchData() {
      try {
        const ts = Date.now();
        const res = await fetch(`https://akash-proxy.onrender.com/api/data?ts=${ts}`);
        const data = await res.json();
        const list = data?.Data?.list;

        if (list && list.length >= 3) {
          // Simple example prediction: average of last 3 numbers
          const nums = list.slice(0, 3).map(item => parseInt(item.result));
          const avg = Math.round(nums.reduce((a, b) => a + b, 0) / nums.length);
          const color = avg % 2 === 0 ? 'Green' : 'Red';
          document.getElementById("prediction").innerText = `Predicted: ${avg} (${color})`;
        } else {
          document.getElementById("prediction").innerText = "Not enough data.";
        }
      } catch (error) {
        document.getElementById("prediction").innerText = "Error fetching data.";
      }
    }

    fetchData();
    setInterval(fetchData, 30000); // Refresh every 30s
  </script>
</body>
</html>
